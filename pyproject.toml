[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gdex-mcp"
version = "0.1.0"
description = "MCP server for the GDEX (Geoscience Data Exchange) data portal"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0,<2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
gdex-mcp = "gdex_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gdex_mcp*"]
