apiVersion: apps/v1
kind: Deployment
metadata:
  {{ if .Values.testName }}
  name: {{ .Values.testName }}-{{ .Values.webapp.name }}
  {{ else }}
  name: {{ .Values.webapp.name }}
  {{ end }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{ if .Values.testName }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    app.kubernetes.io/name: {{ .Values.testName }}-gdex-mcp
    app.kubernetes.io/instance: {{ .Values.testName }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app: {{ .Values.testName }}-{{ .Values.webapp.name }}
    {{ else }}
    app: {{ .Values.webapp.name }}
    {{ end }}
    group: {{ .Values.webapp.group }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{ if .Values.testName }}
      app: {{ .Values.testName }}-{{ .Values.webapp.name }}
      app.kubernetes.io/instance: {{ .Values.testName }}
      {{ else }}
      app: {{ .Values.webapp.name }}
      {{ end }}
  template:
    metadata:
      labels:
        {{ if .Values.testName }}
        app: {{ .Values.testName }}-{{ .Values.webapp.name }}
        app.kubernetes.io/instance: {{ .Values.testName }}
        {{ else }}
        app: {{ .Values.webapp.name }}
        {{ end }}
    spec:
      containers:
      {{ if .Values.testName }}
      - name: {{ .Values.testName }}-{{ .Values.webapp.name }}
      {{ else }}
      - name: {{ .Values.webapp.name }}
      {{ end }}
        image: {{ .Values.webapp.container.image }}
        imagePullPolicy: Always
        resources:
          requests:
            memory: {{ .Values.webapp.container.requests.memory }}
            cpu: {{ .Values.webapp.container.requests.cpu }}
          limits:
            memory: {{ .Values.webapp.container.limits.memory }}
            cpu: {{ .Values.webapp.container.limits.cpu }}
        ports:
        - containerPort: {{ .Values.webapp.container.port }}
        env:
        - name: GDEX_MCP_TRANSPORT
          value: streamable-http
        - name: GDEX_MCP_HOST
          value: "0.0.0.0"
        - name: GDEX_MCP_PORT
          value: "{{ .Values.webapp.container.port }}"
        # Without this the MCP SDK's DNS-rebinding protection rejects the
        # public hostname with "421 Invalid Host header".
        - name: GDEX_MCP_ALLOWED_HOSTS
          value: {{ .Values.webapp.tls.fqdn | quote }}
        - name: GDEX_BASE_URL
          value: {{ .Values.webapp.env.gdexBaseUrl }}
        # No GDEX_TOKEN here — this deployment serves many callers, each
        # supplying their own GDEX token as an Authorization header on their
        # MCP requests (see gdex_mcp/server.py's _authed_client() /
        # _BearerTokenMiddleware). A shared process-wide token would mean
        # every caller's subsetting requests ran as one identity.
